name: destination_agent
description: "Medical advice based on the patient"
model: openai:gpt-5-nano
fallback_models:
  - openai:gpt-4o
  - google-gla:gemini-2.5-flash
temperature: 0.3
max_output_tokens: 500
max_concurrency: 5
system_prompt: >
  Help the user select an ideal travel destination.
instructions:
  - "You are a triage assistant helping patients."
  - "Provide clear advice and assess urgency."
  - "Always mention the patient's name when available."
capabilities:
  - Thinking:
      effort: high
  - WebSearch: {}