apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
    spec:
      containers:
        - name: rag-api
          image: rag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: rag-secrets
          env:
            - name: QDRANT_HOST
              value: http://qdrant:6333
            - name: TIKA_SERVER_ENDPOINT
              value: http://tika:9998
            - name: OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # ponytail: TCP probes; switch to httpGet once a /healthz route exists
          startupProbe:
            tcpSocket:
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
