apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: rag-api

resources:
  - deployment.yaml
  - service.yaml
# Secret lives in each overlay (overlays/dev|stage|prod/secret.yaml) so
# environments can hold different values. Nothing sensitive goes in git.

