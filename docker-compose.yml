services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  tika:
    image: apache/tika:latest
    container_name: tika
    ports:
      - "9998:9998"
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  # FastAPI app with live reload: edits to src/ restart the worker on the fly.
  app:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    container_name: app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "uv sync --frozen --quiet && uv run uvicorn src.routes:app --host 0.0.0.0 --port 8010 --reload"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/src # routes/main live in src/, dag imported as src.dag
      HF_HOME: /app/.hf-cache # cache embedding model across reloads & restarts
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      QDRANT_HOST: http://qdrant:6333
      TIKA_SERVER_ENDPOINT: http://tika:9998
    volumes:
      - .:/app
      - app_venv:/app/.venv # shadow the host .venv (macOS binaries, wrong platform)
      - app_hf:/app/.hf-cache
    ports:
      - "8010:8010"
    depends_on:
      - qdrant
      - tika
      - jaeger
      - temporal

volumes:
  qdrant_data:
  app_venv:
  app_hf: