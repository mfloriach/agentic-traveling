[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "mfloriach90@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.126",
    "docx>=0.2.4",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.1.0",
    "langgraph>=1.2.16",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "prometheus-client>=0.26.0",
    "pybreaker>=1.4.1",
    "pydantic>=2.14.1",
    "pydantic-ai>=2.61.0",
    "pydantic-ai-slim>=2.61.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "temporalio>=1.35.0",
    "tenacity>=9.1.4",
    "tika>=3.3.2",
    "uvicorn[standard]>=0.54.0",
    "valkey>=6.2.0",
]

[project.scripts]
rag = "dag:main"

[tool.uv]
package = false

[tool.pyright]
reportMissingTypeStubs = false
typeCheckingMode = "recommended"
failOnWarnings = false

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "basedpyright>=1.40.2",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-boto3>=1.43.126",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "I",      # Import sorting
    "UP",     # Pyupgrade
    "B",      # Bugbear
    "SIM",    # Simplification
    "S",      # Security rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest asserts

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
